<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Selector Activity</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 id="title"></h1>
  <p class="info">This is the first paragraph.</p>
  <p class="info">This is the second paragraph.</p>
  
  <button id="highlightBtn">Highlight Title (by ID)</button>
  <button id="changeClassBtn">Change Class Elements (by Class)</button>
  <button id="tagBtn">Count Paragraphs (by Tag)</button>
  <button id="queryBtn">Change First Paragraph (querySelector)</button>
  <button id="queryAllBtn">Change All Paragraphs (querySelectorAll)</button>

  <p id="output"></p>

  <script src="script.js"></script>
</body>
</html>
